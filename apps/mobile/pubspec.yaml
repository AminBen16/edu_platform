name: mobile
description: The mobile application for the Edu Platform.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6

  # Networking
  http: ^1.2.0

  # State Management
  flutter_riverpod: ^3.1.0

  # Local Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # JSON Serialization
  json_annotation: ^4.8.1

  # URL Launcher for payments
  url_launcher: ^6.2.0

  # Image Picker for uploads
  image_picker: ^1.0.4

  # Screen Recording
  flutter_screen_recording: ^2.0.24

  # Video/Recording audio
  record: ^5.0.0

  # Socket.IO for chat
  socket_io_client: ^3.0.2
  dio: ^5.9.0

  # WebRTC for live classes (Free P2P)
  flutter_webrtc: ^0.9.48+hotfix.1

  # Video Player
  video_player: ^2.8.1

  # Audio Player
  just_audio: ^0.9.36

  # Permissions
  permission_handler: ^11.0.1

  # Share functionality
  share_plus: ^7.0.0

  # Local notifications
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
